<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NCST Rider GPS Transmitter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>

<body class="bg-gray-100 p-4 font-sans max-w-md mx-auto">
  <div class="bg-white p-5 rounded-lg shadow-md border-t-4 border-blue-900">
    <h2 class="text-xl font-bold text-gray-800 mb-2">Courier Live GPS Broadcaster</h2>
    <p class="text-xs text-gray-500 mb-4">NCST Point-to-Point Express</p>

    <div class="mb-4">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Tracking Number</label>
      <input type="text" id="tracking-input" value="TRACK-908123"
        class="w-full border rounded p-2 text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none" readonly />
    </div>

    <button id="start-btn" onclick="startBroadcasting()"
      class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
      Start Location Sharing
    </button>

    <div id="status-box" class="mt-4 p-3 bg-gray-50 border rounded hidden">
      <p class="text-xs text-gray-500 font-semibold">Status: <span id="status-text"
          class="text-green-600">Broadcasting...</span></p>
      <p class="text-xs font-mono text-gray-700 mt-1">Lat: <span id="lat-val">--</span> | Lng: <span
          id="lng-val">--</span></p>
    </div>
  </div>

  <script>
    const socket = io();
    let watchId = null;

    function startBroadcasting() {
      const trackingNumber = document.getElementById('tracking-input').value;

      if (!('geolocation' in navigator)) {
        alert('Geolocation is not supported by your browser.');
        return;
      }

      document.getElementById('status-box').classList.remove('hidden');
      document.getElementById('start-btn').disabled = true;
      document.getElementById('start-btn').classList.add('opacity-50');

      // Continuously monitor and send rider position
      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const { latitude, longitude } = position.coords;

          document.getElementById('lat-val').innerText = latitude.toFixed(6);
          document.getElementById('lng-val').innerText = longitude.toFixed(6);

          // Emit location payload to server
          socket.emit('update-location', {
            trackingNumber,
            latitude,
            longitude
          });
        },
        (error) => {
          console.error(error);
          document.getElementById('status-text').innerText = 'GPS Error: ' + error.message;
          document.getElementById('status-text').className = 'text-red-600';
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 5000
        }
      );
    }
  </script>
</body>

</html>
